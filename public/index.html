<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信小程序工具</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #5b6cff;
            --accent-hover: #4a5bf0;
            --text: #2f3542;
            --text-secondary: #6b7280;
            --text-hint: #9aa0ae;
            --border: #e8eaf2;
            --bg: #f4f5fa;
            --danger: #e5484d;
            --success: #30a46c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 52px 20px 24px;
        }

        /* macOS Electron: titleBarStyle:hidden 后原生标题栏不可拖,
           在页面顶部开一条拖动区, 避开左上角红绿灯按钮 */
        .drag-strip {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            -webkit-app-region: drag;
            z-index: 9999;
        }

        /* 交互元素必须显式声明 no-drag, 否则按钮点不动 */
        .app button,
        .app input,
        .app a,
        .app li,
        .modal-card,
        .modal-card button {
            -webkit-app-region: no-drag;
        }

        .app {
            width: 100%;
            max-width: 760px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 24px;
        }

        /* 设置入口固定在窗口右上角, 不随内容列移动。
           顶部 38px 是可拖拽区(.drag-strip, z-index 9999), 按钮必须盖在它
           之上并声明 no-drag, 否则点击会被拖拽层吞掉(表现为时灵时不灵) */
        .settings-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10000;
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #fff;
            color: var(--text-secondary);
            font-size: .95em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s ease, color .15s ease;
            -webkit-app-region: no-drag;
        }

        .settings-btn:hover {
            background: #f0f2f8;
            color: var(--text);
        }

        .app-title {
            color: var(--text);
            font-size: 1.5em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* ==================== 空态: 扫描入口 ==================== */
        .empty-card {
            padding: 56px 32px;
            text-align: center;
        }

        .empty-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #eef0ff;
            color: var(--accent);
            font-size: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-title {
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-desc {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 26px;
        }

        /* ==================== 扫描结果 ==================== */
        .scan-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: #fafbfd;
        }

        .scan-title {
            flex: 1;
            font-size: 0.95em;
            font-weight: 600;
        }

        .scan-title i {
            color: var(--accent);
            margin-right: 6px;
        }

        .scan-count {
            color: var(--text-secondary);
            font-size: 0.85em;
        }

        .scan-count strong {
            color: var(--text);
        }

        .scan-body {
            font-size: 0.9em;
        }

        .scan-hint {
            margin: 14px 18px;
            color: #9a6200;
            background: #fff8e8;
            border: 1px solid #ffe3a8;
            border-radius: 10px;
            padding: 12px 14px;
            line-height: 1.7;
        }

        /* 缺少「完全磁盘访问权限」的引导提示 */
        .perm-warning {
            margin: 14px 18px;
            background: #fdeef0;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 14px 16px;
            line-height: 1.7;
        }

        .perm-warning .perm-title {
            color: var(--danger);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .perm-warning .perm-desc {
            color: #8a3a3e;
            font-size: .93em;
            margin-bottom: 10px;
        }

        .perm-warning .perm-btn {
            padding: 7px 16px;
            font-size: .9em;
        }

        .scan-hint code {
            background: rgba(0, 0, 0, .05);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: .92em;
        }

        .scan-paths {
            margin: 0 18px 16px;
            color: var(--text-hint);
            font-size: .92em;
            line-height: 1.8;
            word-break: break-all;
        }

        .scan-loading {
            padding: 36px 18px;
            text-align: center;
            color: var(--text-hint);
        }

        .scan-loading i {
            color: var(--accent);
            margin-right: 8px;
        }

        .pkg-list {
            list-style: none;
            padding: 4px 10px;
        }

        .pkg-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            transition: background .12s ease;
        }

        .pkg-row + .pkg-row {
            border-top: 1px solid var(--border);
        }

        .pkg-row:hover {
            background: #f7f8fc;
        }

        /* 未命中真图标时的中性占位色块 (原来按 appid 哈希渐变, 已按要求去掉) */
        .pkg-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: linear-gradient(135deg, #eceef2, #e2e5eb);
            color: #9aa2b1;
            font-size: .82em;
            font-weight: 700;
            letter-spacing: .5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* 微信缓存图标: 必须显式给出尺寸, 否则会按原图大小撑破 40px 方块;
           图片加载成功后容器加 .has-img, 去掉占位背景 (logo 自带圆角底色) */
        .pkg-icon.has-img {
            background: transparent;
        }

        .pkg-icon .icon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .pkg-main {
            flex: 1;
            min-width: 0;
        }

        .pkg-name {
            font-weight: 600;
            font-size: .95em;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pkg-name .appid-text {
            font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
            font-weight: 500;
            font-size: .92em;
        }

        .pkg-meta {
            color: var(--text-hint);
            font-size: .8em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pkg-meta .ver {
            color: var(--text-secondary);
            background: #f0f1f5;
            padding: 1px 7px;
            border-radius: 6px;
            font-size: .9em;
            font-weight: 500;
        }

        .pkg-side {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        /* 状态角标: 编译中/完成/失败, 点击可重开日志窗 */
        .pkg-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: .72em;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .pkg-badge.show {
            display: flex;
        }

        .pkg-badge.running {
            color: var(--accent);
            background: #eef0ff;
        }

        .pkg-badge.success {
            color: var(--success);
            background: #e7f6ee;
            border-color: #c9ecd9;
        }

        .pkg-badge.error {
            color: var(--danger);
            background: #fdebec;
            border-color: #f7cfd1;
        }

        /* ==================== 按钮 ==================== */
        .btn-primary {
            border: none;
            background: var(--accent);
            color: #fff;
            padding: 10px 26px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background .15s ease;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn-primary:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn-sm {
            padding: 7px 16px;
            font-size: .86em;
            border-radius: 8px;
        }

        /* 列表行的反编译按钮: 默认低调描边, 悬浮所在行时才点亮 ——
           50 行 50 个实心蓝按钮太吵, 整页只有当前行有强色 */
        .btn-decompile {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: .84em;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
        }

        .pkg-row:hover .btn-decompile:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-decompile:hover:not(:disabled) {
            box-shadow: 0 2px 8px rgba(79, 97, 235, .35);
        }

        .btn-decompile:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn-ghost {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: .84em;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background .15s ease, color .15s ease;
        }

        .btn-ghost:hover:not(:disabled) {
            background: #f0f2f8;
            color: var(--text);
        }

        .btn-ghost:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn-danger {
            color: var(--danger);
            border-color: #f5d3d5;
        }

        .btn-danger:hover:not(:disabled) {
            background: #fdecec;
            color: var(--danger);
        }

        .app-footer {
            margin-top: 28px;
            color: var(--text-hint);
            font-size: .78em;
            text-align: center;
            line-height: 1.8;
        }

        /* ==================== 日志弹窗 ==================== */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 18, 35, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal-card {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 780px;
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f0b429;
            flex-shrink: 0;
        }

        .status-dot.running {
            background: #f0b429;
            animation: pulse 1.2s ease infinite;
        }

        .status-dot.success {
            background: var(--success);
        }

        .status-dot.error {
            background: var(--danger);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .35; }
        }

        .modal-title {
            flex: 1;
            min-width: 0;
            font-weight: 600;
            font-size: .98em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-close {
            border: none;
            background: none;
            color: var(--text-hint);
            font-size: 1.25em;
            cursor: pointer;
            line-height: 1;
            padding: 2px 4px;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .log-view {
            background: #1e2230;
            min-height: 280px;
            height: 52vh;
            overflow-y: auto;
            padding: 14px 18px;
            font-family: 'Courier New', monospace;
            font-size: .84em;
            line-height: 1.55;
            color: #d4d7e4;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-line {
            margin-bottom: 4px;
        }

        .log-line.success { color: #7be0a8; }
        .log-line.warning { color: #ffcb6b; }
        .log-line.error   { color: #ff8a8a; }
        .log-line.info    { color: #d4d7e4; }

        .modal-foot {
            display: flex;
            gap: 10px;
            padding: 14px 18px;
            border-top: 1px solid var(--border);
        }

        .modal-foot .btn-primary {
            flex: 1;
        }

        /* 设置弹窗: 窄卡片 + 表单 (按钮保持自然宽度) */
        .settings-card {
            max-width: 540px;
        }

        .settings-card .modal-foot .btn-primary {
            flex: 0 0 auto;
        }

        .settings-body {
            padding: 20px 18px;
        }

        .settings-field .settings-label {
            display: block;
            font-weight: 600;
            font-size: .92em;
            color: var(--text);
            margin-bottom: 8px;
        }

        .settings-row {
            display: flex;
            gap: 8px;
        }

        .settings-input {
            flex: 1;
            min-width: 0;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: .86em;
            color: var(--text);
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .settings-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 97, 235, .12);
        }

        /* 只读时的输入框不需要焦点高亮 */
        .settings-input:read-only:focus {
            box-shadow: none;
        }

        .settings-hint {
            margin-top: 9px;
            color: var(--text-hint);
            font-size: .82em;
            line-height: 1.6;
        }

        /* 「…」是全角字符(占一个汉字宽), 按钮自然宽度会把它裁掉;
           flex:none + nowrap 让按钮按含省略号的真实内容自适应 */
        .settings-row .btn-primary {
            flex: none;
            white-space: nowrap;
            padding: 10px 16px;
        }

        .modal-foot .btn-ghost {
            flex: 1;
            justify-content: center;
            font-size: .92em;
            padding: 10px 0;
        }

        @media (max-width: 600px) {
            .pkg-side {
                flex-direction: column;
                gap: 6px;
            }

            .modal {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="drag-strip"></div>
    <div class="app">
        <header class="app-header">
            <div class="app-title">微信小程序工具</div>
            <button type="button" class="settings-btn" id="settingsBtn" title="设置">
                <i class="fas fa-gear"></i>
            </button>
        </header>

        <!-- 状态 1: 空态, 只有扫描入口 -->
        <section id="emptyState" class="card empty-card">
            <div class="empty-icon"><i class="fas fa-magnifying-glass"></i></div>
            <div class="empty-title">扫描本机小程序包</div>
            <div class="empty-desc">自动扫描本机的小程序 / 小游戏包，反编译后可查看源码</div>
            <button type="button" id="scanEntryBtn" class="btn-primary">
                <i class="fas fa-radar"></i> 开始扫描
            </button>
        </section>

        <!-- 状态 2: 扫描结果列表 -->
        <section id="scanSection" class="card hidden">
            <div class="scan-head">
                <span class="scan-title"><i class="fas fa-list-check"></i>扫描结果</span>
                <span class="scan-count" id="scanCount"></span>
                <button type="button" class="btn-ghost btn-danger" id="clearScanBtn">
                    <i class="fas fa-trash"></i> 清空
                </button>
                <button type="button" class="btn-ghost" id="rescanBtn">
                    <i class="fas fa-rotate"></i> 重新扫描
                </button>
            </div>
            <div class="scan-body" id="scanBody"></div>
        </section>

        <footer class="app-footer">
            支持小程序 / 小游戏 · 分包与插件还原 · JS / WXML / WXSS / WXS / JSON
        </footer>
    </div>

    <!-- 状态 3: 反编译日志弹窗 -->
    <div id="logModal" class="modal hidden">
        <div class="modal-card">
            <div class="modal-head">
                <span class="status-dot running" id="logStatusDot"></span>
                <div class="modal-title" id="logTitle">反编译日志</div>
                <button type="button" class="btn-ghost" id="copyLogBtn">
                    <i class="fas fa-copy"></i> 复制
                </button>
                <button type="button" class="modal-close" id="closeLogBtn">&times;</button>
            </div>
            <div class="log-view" id="logView"></div>
            <!-- 编译成功后才出现的产物操作区 -->
            <div class="modal-foot hidden" id="logFooter">
                <button type="button" class="btn-primary" id="openDirBtn">
                    <i class="fas fa-folder-open"></i> 打开产物目录
                </button>
                <button type="button" class="btn-ghost" id="downloadZipBtn">
                    <i class="fas fa-download"></i> 下载 zip
                </button>
                <button type="button" class="btn-ghost btn-danger" id="clearOutputBtn">
                    <i class="fas fa-trash"></i> 清除本次产物
                </button>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-card settings-card">
            <div class="modal-head">
                <div class="modal-title"><i class="fas fa-gear"></i> 设置</div>
                <button type="button" class="modal-close" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="settings-body">
                <div class="settings-field">
                    <label class="settings-label" for="settingsOutputInput">反编译输出目录</label>
                    <div class="settings-row">
                        <input type="text" id="settingsOutputInput" class="settings-input" readonly
                               placeholder="请点击右侧按钮选择目录" spellcheck="false" autocomplete="off">
                        <button type="button" class="btn-primary hidden" id="settingsBrowseBtn">选择目录</button>
                    </div>
                    <div class="settings-hint" id="settingsHint">
                        点击「选择目录」指定反编译输出位置，源码会直接写入该目录。清空后保存可恢复默认位置。
                    </div>
                </div>
            </div>
            <div class="modal-foot" id="settingsFooter">
                <button type="button" class="btn-ghost" id="settingsCancelBtn">取消</button>
                <button type="button" class="btn-primary" id="settingsSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
